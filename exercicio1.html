<!DOCTYPE html>
<html lang="pt-br">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 - Contador de Caracteres</title>
</head>


<body>


    <textarea id="comentario" placeholder="Digite seu comentário..."></textarea>
    <p id="contador">0 caracteres</p>


    <script>
        const campoComentario = document.querySelector("#comentario")
        const contador = document.querySelector("#contador")


        function contarCaracteres() {
            const quantidade = campoComentario.value.length
            contador.textContent = `${quantidade} caracteres`
        }


        campoComentario.addEventListener("input", contarCaracteres)
    </script>


</body>

</html>
